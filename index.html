<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Excuse Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c1914;
      --paper: #f6f0e6;
      --card: #fffdf8;
      --accent: #c45c26;
      --muted: #6b645a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      margin: 0 0 8px;
      letter-spacing: -0.03em;
    }
    .lede {
      color: var(--muted);
      font-size: 1.1rem;
      margin: 0 0 32px;
      max-width: 38ch;
    }
    .stage {
      background: var(--card);
      border: 1px solid #e4d9c8;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(28, 25, 20, 0.08);
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #d8ccba;
      background: #fff;
      font: inherit;
      margin-bottom: 20px;
    }
    button {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: #fff;
      font: 600 1rem/1 "Source Sans 3", sans-serif;
      padding: 14px 22px;
      border-radius: 999px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .excuse {
      margin-top: 28px;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      line-height: 1.35;
      min-height: 4.2em;
    }
    .meta {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Excuse Generator</h1>
    <p class="lede">Need a moment? Pick a situation and we’ll craft a politely outrageous alibi.</p>
    <section class="stage">
      <label for="scene">Situation</label>
      <select id="scene">
        <option value="late">Running late</option>
        <option value="meeting">Missed a meeting</option>
        <option value="homework">Homework not done</option>
        <option value="party">Skipping a party</option>
        <option value="work">Can’t finish work today</option>
      </select>
      <button type="button" id="go">Give me an excuse</button>
      <p class="excuse" id="excuse">Your perfectly reasonable excuse will land here.</p>
      <p class="meta" id="meta"></p>
    </section>
  </main>
  <script>
    const bank = {
      late: [
        "A flock of geese claimed the crosswalk and I am not arguing with waterfowl.",
        "My coffee machine started a firmware update at the worst possible second.",
        "The elevator stopped on every floor to admire itself."
      ],
      meeting: [
        "My calendar invited a second me, and the other me took the slot.",
        "I was trapped in a hallway conversation that had no legal exit.",
        "The video link asked for a password I definitely never set."
      ],
      homework: [
        "My notes joined a union and refused unpaid overtime.",
        "The printer ate page three and demanded snacks.",
        "I had to explain gravity to a very confident cat."
      ],
      party: [
        "My plants scheduled an emergency watering summit.",
        "I promised the sofa I would stay in tonight.",
        "A documentary about bread started and leaving felt rude."
      ],
      work: [
        "The spreadsheet developed feelings and needed space.",
        "My keyboard is practicing a slow movement in B-flat.",
        "I found a plot hole in the task list and had to rewrite act two."
      ]
    };
    const go = document.getElementById("go");
    const scene = document.getElementById("scene");
    const excuse = document.getElementById("excuse");
    const meta = document.getElementById("meta");
    go.addEventListener("click", () => {
      const list = bank[scene.value];
      const pick = list[Math.floor(Math.random() * list.length)];
      excuse.textContent = pick;
      meta.textContent = "Freshly minted. Use responsibly.";
    });
  </script>
</body>
</html>
